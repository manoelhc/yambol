types:
  - name: id
    inline: BIGSERIAL
    fk: BIGINT
  - name: name
    inline: VARCHAR(255) UNIQUE NOT NULL
    index: true
  - name: now
    inline: TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
  - name: email
    inline: VARCHAR(255) UNIQUE NOT NULL CHECK (email ~* '^[^\s@]+@[^\s@]+\.[^\s@]+$')

tables: 
  - &users
    name: users
    fields:
      - name: id
        type: id
        pk: true
      - name: name
        type: name
  - &groups 
    name: groups 
    fields:
      - name: id
        type: id
        pk: true
      - name: name
        type: name
  - name: users_group
    fields:
      - name: user_id
        type: *users
      - name: group_id
        type: *groups
