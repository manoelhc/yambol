name: bizsimple

types:
  - name: id
    inline: BIGSERIAL
    fk: BIGINT
    id: true
  - name: tenant_co_id
    inline: BIGINT NOT NULL
    index: true
    fk: BIGINT NOT NULL
  - name: finance_co_id
    inline: BIGINT NOT NULL
    index: true
    fk: BIGINT NOT NULL
  - name: name
    inline: VARCHAR(255) UNIQUE NOT NULL
    index: true
  - name: name_people
    inline: VARCHAR(255) NOT NULL
    index: true
  - name: now
    inline: TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
  - name: future
    inline: TIMESTAMP WITH TIME ZONE
  - name: fiscal_code
    inline: VARCHAR(32) UNIQUE
  - name: email
    inline: VARCHAR(255) UNIQUE NOT NULL CHECK (email ~* '^[^\s@]+@[^\s@]+\.[^\s@]+$')
  - name: country_code
    inline: CHAR(2)
  - name: tag
    inline: VARCHAR(32) PRIMARY KEY
    id: true
  - name: hash
    inline: VARCHAR(255)
  - name: money
    inline: NUMERIC(10,2)
  - name: text
    inline: text

tables:
  - &countries
    name: countries
    fields:
      - name: id
        type: id
      - name: code
        type: country_code

  - &tenants
    name: tenants
    fields: 
      - name: id
        type: id
      - name: fiscal_code
        type: fiscal_code
      - name: name
        type: name
      - name: country_id
        type: *countries
      - name: responsible
        type: name
      - name: billing_email
        type: email
      - name: commercial_email
        type: email
      - name: billing_phone
        type: name
      - name: commercial_phone
        type: name
      - name: seats
        type: SMALLINT
      - name: created
        type: now
      - name: updated
        type: future
      - name: deleted
        type: future

  - &utags
    name: utags
    fields: 
      - name: name
        type: tag
      - name: tenant_id
        type: *tenants
      - name: system_tag
        type: BOOLEAN

  - &persons
    name: persons
    fields:
      - name: id
        type: id
      - name: tenant_id
        type: *tenants
      - name: name
        type: name_people
      - name: id_number
        type: VARCHAR(20)

  - &emp_benefits
    name: emp_benefits
    fields:
      - name: id
        type: id
      - name: tenant_id
        type: *tenants
      - name: addition_price
        type: money
      - name: discount_price
        type: money
      - name: created
        type: now
      - name: updated
        type: future
      - name: deleted
        type: future

  - &business_contracts_templates
    name: business_contracts_templates
    desc: "Business contracts templates for clients, employees and contractors. It can be generated from a AI prompt"
    fields:
      - name: id
        type: id
      - name: tenant_id
        type: *tenants
      - name: name
        type: name
      - name: title
        type: name
      - name: markdown
        type: text
      - name: created
        type: now
      - name: updated
        type: future
      - name: deleted
        type: future

  - &business_contracts_template_variables
    desc: "Variables for business contracts templates, using several sources like tenants, business contracts templates, employees, contractors and clients"
    name: business_contracts_template_variables
    fields:
      - name: id
        type: id
      - name: tenant_id
        type: *tenants
      - name: business_contract_template_id
        type: *business_contracts_templates
      - name: name
        type: name
      - name: type
        type: name
      - name: created
        type: now
      - name: updated
        type: future
      - name: deleted
        type: future

  - &recurring_expenses
    name: recurring_expenses
    fields:
      - name: id
        type: id
      - name: tenant_id
        type: *tenants
      - name: name
        type: name
      - name: price
        type: money
      - name: start_date
        type: now
      - name: recurring_period
        type: INTEGER
      - name: end_date
        type: future
      - name: created
        type: now
      - name: updated
        type: future
      - name: deleted
        type: future

  - &business_contracts
    name: business_contracts
    fields:
      - name: id
        type: id
      - name: tenant_id
        type: *tenants
      - name: name
        type: name
      - name: business_contract_template_id
        type: *business_contracts_templates
      - name: final_markdown
        type: text
      - name: created
        type: now
      - name: updated
        type: future
      - name: deleted
        type: future

  - &emp_contracts
    name: emp_contracts
    fields:
      - name: id
        type: id
      - name: name
        type: name
      - name: hourly_price
        type: money
      - name: daily_price
        type: money
      - name: monthly_price
        type: money
      - name: created
        type: now
      - name: updated
        type: future
      - name: deleted
        type: future
      
  - name: emp_ctr_benefits
    fields:
      - name: id
        type: id
      - name: tenant_id
        type: *tenants
      - name: emp_contract_id
        type: *emp_contracts
      - name: emp_benefit_id
