  - &employees
    name: employees
    fields:
      - name: id
        type: id
      - name: tenant_id
        type: *tenants
      - name: person_id
        type: *persons
      - name: emp_contract_id
        type: *emp_contracts
      - name: contract_deadline
        type: future
      - name: created
        type: now
      - name: updated
        type: future
      - name: deleted
        type: future

  - &payroll
